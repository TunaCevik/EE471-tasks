name: CD Cloud Deployment

on:
  workflow_run:
    workflows: ["CI Semantic Versioning", "CI Linting"]
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Cloud VM
    runs-on: self-hosted
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t backend-cloud:latest .

      - name: Stop and remove existing container
        run: |
          docker stop backend-cloud-container || true
          docker rm backend-cloud-container || true

      - name: Run Docker Container
        run: |
          docker run -d \
            --name backend-cloud-container \
            -p 8001:8000 \
            --restart always \
            backend-cloud:latest
